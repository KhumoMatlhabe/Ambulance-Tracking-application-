<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Request & Live Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

  <!-- Top Emergency Bar -->
  <header class="bg-red-600 p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-lg font-bold flex items-center gap-2">
      <span>🚨</span> Citizen Emergency Transport
    </h1>
    <span id="status-badge" class="text-xs bg-red-800 px-3 py-1 rounded-full font-semibold">
      Ready
    </span>
  </header>

  <main class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
    <!-- Controls Sidebar -->
    <div class="w-full md:w-96 bg-slate-800 p-6 flex flex-col space-y-4 border-r border-slate-700">
      
      <!-- SOS Button -->
      <button 
        id="sos-btn" 
        onclick="requestAmbulance()" 
        class="w-full bg-red-600 hover:bg-red-500 text-white font-extrabold py-4 px-6 rounded-2xl shadow-xl text-lg tracking-wide uppercase transition transform active:scale-95 border-2 border-red-400 animate-pulse"
      >
        🆘 Request Emergency Ambulance
      </button>

      <!-- Patient Information -->
      <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700">
        <h2 class="text-xs font-bold uppercase text-slate-400">Patient Emergency Profile</h2>
        <input id="patient-name" type="text" placeholder="Full Name" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-red-500" />
        <input id="patient-phone" type="tel" placeholder="Contact Phone Number" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-red-500" />
        <textarea id="medical-notes" placeholder="Medical Notes / Allergies / Symptoms" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm h-20 focus:outline-none focus:border-red-500"></textarea>
      </div>

      <!-- Tracking Info Card -->
      <div id="tracker-card" class="hidden bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-sm">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-slate-400 font-bold">Assigned Unit:</span>
          <span id="assigned-unit" class="text-emerald-400 font-extrabold">Searching...</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-400">Status:</span>
          <span id="unit-status" class="text-blue-400 font-semibold">En Route</span>
        </div>
      </div>
    </div>

    <!-- Live Map View -->
    <div id="map" class="flex-1 min-h-[300px] bg-slate-950"></div>
  </main>

  <script>
    const socket = io();
    let patientMarker = null;
    let ambulanceMarker = null;

    // Initialize map
    const map = L.map('map').setView([-33.9249, 18.4241], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function requestAmbulance() {
      if (!('geolocation' in navigator)) {
        alert('Geolocation is required to pinpoint your emergency location.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          // Update Patient Marker on map
          if (patientMarker) map.removeLayer(patientMarker);
          patientMarker = L.marker([lat, lng]).addTo(map)
            .bindPopup('<b>Your Location</b>').openPopup();

          map.setView([lat, lng], 14);

          // Emit emergency request to server
          socket.emit('emergency_request', {
            name: document.getElementById('patient-name').value || 'Anonymous Patient',
            phone: document.getElementById('patient-phone').value || 'Unspecified',
            notes: document.getElementById('medical-notes').value || 'None',
            lat: lat,
            lng: lng
          });

          document.getElementById('status-badge').innerText = 'Request Sent';
          document.getElementById('status-badge').className = 'text-xs bg-amber-600 px-3 py-1 rounded-full font-semibold';
          document.getElementById('tracker-card').classList.remove('hidden');
          document.getElementById('sos-btn').disabled = true;
          document.getElementById('sos-btn').classList.add('opacity-50', 'cursor-not-allowed');
        },
        (error) => alert(`Unable to fetch location: ${error.message}`),
        { enableHighAccuracy: true }
      );
    }

    // Listen for live ambulance updates
    socket.on('location_changed', (unit) => {
      document.getElementById('assigned-unit').innerText = unit.unitId;
      document.getElementById('unit-status').innerText = unit.status;

      if (ambulanceMarker) {
        ambulanceMarker.setLatLng([unit.lat, unit.lng]);
      } else {
        ambulanceMarker = L.marker([unit.lat, unit.lng]).addTo(map)
          .bindPopup(`<b>${unit.unitId}</b><br/>En Route`);
      }
    });
  </script>
</body>
</html>
