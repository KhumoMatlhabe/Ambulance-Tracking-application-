<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambulance Driver Telemetry</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io Client Script -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/auth-check.js"></script>
  <script>
    // Only DRIVER role allowed
    const currentUser = enforceAuthGuard(['DRIVER']);
  </script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center justify-center font-sans relative">

  <!-- Incoming Emergency Dispatch Modal (Hidden by Default) -->
  <div id="dispatch-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border-2 border-red-500 rounded-2xl p-6 shadow-2xl space-y-4 animate-bounce-once">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <span class="text-xs bg-red-600 text-white px-3 py-1 rounded-full font-extrabold uppercase animate-pulse">
          🚨 Incoming Emergency Call
        </span>
        <span id="call-timestamp" class="text-xs text-slate-400">Just now</span>
      </div>

      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-slate-400">Patient Name:</span>
          <span id="patient-name-modal" class="font-bold text-white">John Doe</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-400">Phone Number:</span>
          <a id="patient-phone-modal" href="#" class="font-bold text-blue-400 underline">--</a>
        </div>
        <div class="space-y-1">
          <span class="text-slate-400 block">Medical Notes:</span>
          <p id="patient-notes-modal" class="bg-slate-900 p-2 rounded text-slate-300 text-xs italic border border-slate-700">None</p>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="acceptEmergencyRequest()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
          ✅ Accept Request
        </button>
        <button onclick="dismissModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 rounded-xl transition text-sm">
          Decline
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🚑</span>
        <h1 class="text-lg font-bold tracking-wide">Driver GPS Transmitter</h1>
      </div>
      <span id="socket-status" class="text-xs bg-red-900/80 text-red-300 px-3 py-1 rounded-full font-semibold border border-red-700">
        Offline
      </span>
    </div>
    
    <!-- Active Request Card (When Accepted) -->
    <div id="active-call-card" class="hidden bg-red-950/40 border border-red-500/50 p-4 rounded-xl space-y-2 text-xs">
      <div class="flex justify-between items-center text-red-400 font-bold border-b border-red-900/50 pb-2">
        <span>ACTIVE ASSIGNMENT</span>
        <span id="active-status-badge" class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">EN ROUTE</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Patient:</span>
        <span id="active-patient-name" class="font-semibold text-white">--</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">Contact:</span>
        <span id="active-patient-phone" class="font-semibold text-emerald-400">--</span>
      </div>
    </div>

    <!-- Unit & Status Settings -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Vehicle Unit Identifier</label>
        <input 
          id="unit-id" 
          type="text" 
          value="Ambulance-01" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 font-bold mb-1">Current Duty Status</label>
        <select id="duty-status" onchange="onStatusChange()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-500 transition">
          <option value="AVAILABLE" selected>Available / On Standby</option>
          <option value="EN_ROUTE">En Route to Scene</option>
          <option value="ON_SCENE">On Scene</option>
          <option value="TRANSPORTING">Transporting Patient</option>
        </select>
      </div>
    </div>

    <!-- Telemetry Display Box -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-sm font-mono">
      <div class="flex justify-between">
        <span class="text-slate-500">Latitude:</span>
        <span id="lat-val" class="text-emerald-400 font-bold">--</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Longitude:</span>
        <span id="lng-val" class="text-emerald-400 font-bold">--</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Speed:</span>
        <span id="speed-val" class="text-blue-400 font-bold">--</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-500">Packets Broadcasted:</span>
        <span id="ping-count" class="text-purple-400 font-bold">0</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex gap-4">
      <button 
        id="start-btn" 
        onclick="startTracking()" 
        class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg"
      >
        Start Streaming
      </button>
      <button 
        id="stop-btn" 
        onclick="stopTracking()" 
        disabled 
        class="flex-1 bg-slate-700 opacity-50 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg cursor-not-allowed"
      >
        Stop
      </button>
    </div>

  </div>

  <script>
    const socket = io();
    let watchId = null;
    let packetCounter = 0;
    let currentEmergencyRequest = null;

    const socketStatusEl = document.getElementById('socket-status');
    const unitInputEl = document.getElementById('unit-id');
    const statusSelectEl = document.getElementById('duty-status');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');

    // Server connection listeners
    socket.on('connect', () => {
      socketStatusEl.innerText = 'Connected';
      socketStatusEl.className = 'text-xs bg-emerald-900/80 text-emerald-300 px-3 py-1 rounded-full font-semibold border border-emerald-700';
      
      // Register unit with server as available driver
      socket.emit('register_driver', { unitId: unitInputEl.value });
    });

    socket.on('disconnect', () => {
      socketStatusEl.innerText = 'Disconnected';
      socketStatusEl.className = 'text-xs bg-red-900/80 text-red-300 px-3 py-1 rounded-full font-semibold border border-red-700';
    });

    // LISTEN FOR PATIENT EMERGENCY REQUESTS
    socket.on('incoming_emergency', (requestData) => {
      currentEmergencyRequest = requestData;
      
      // Populate Modal Fields
      document.getElementById('patient-name-modal').innerText = requestData.name || 'Anonymous Patient';
      document.getElementById('patient-phone-modal').innerText = requestData.phone || 'N/A';
      document.getElementById('patient-phone-modal').href = `tel:${requestData.phone}`;
      document.getElementById('patient-notes-modal').innerText = requestData.notes || 'None provided';
      document.getElementById('call-timestamp').innerText = new Date().toLocaleTimeString();

      // Display Dispatch Alert Modal
      document.getElementById('dispatch-modal').classList.remove('hidden');
    });

    // ACCEPT EMERGENCY
    function acceptEmergencyRequest() {
      if (!currentEmergencyRequest) return;

      // Automatically switch duty status to EN_ROUTE
      statusSelectEl.value = 'EN_ROUTE';
      
      // Display Active Card
      document.getElementById('active-patient-name').innerText = currentEmergencyRequest.name;
      document.getElementById('active-patient-phone').innerText = currentEmergencyRequest.phone;
      document.getElementById('active-call-card').classList.remove('hidden');

      // Notify Server of acceptance
      socket.emit('accept_request', {
        requestId: currentEmergencyRequest.id,
        unitId: unitInputEl.value,
        driverName: currentUser?.name || 'Assigned Driver'
      });

      dismissModal();

      // Ensure GPS tracking is started
      if (!watchId) {
        startTracking();
      }
    }

    function dismissModal() {
      document.getElementById('dispatch-modal').classList.add('hidden');
    }

    function onStatusChange() {
      // Re-emit immediately when driver manual status drop-down changes
      if (watchId !== null) {
        navigator.geolocation.getCurrentPosition((position) => {
          socket.emit('update_location', {
            unitId: unitInputEl.value || 'Ambulance-01',
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            status: statusSelectEl.value,
            speed: position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0
          });
        });
      }
    }

    // Start streaming device GPS position
    function startTracking() {
      if (!('geolocation' in navigator)) {
        alert('Geolocation is not supported by your browser or device.');
        return;
      }

      unitInputEl.disabled = true;
      startBtn.disabled = true;
      startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      stopBtn.disabled = false;
      stopBtn.classList.remove('opacity-50', 'cursor-not-allowed');

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : 0;

          document.getElementById('lat-val').innerText = lat.toFixed(5);
          document.getElementById('lng-val').innerText = lng.toFixed(5);
          document.getElementById('speed-val').innerText = `${speed} km/h`;

          socket.emit('update_location', {
            unitId: unitInputEl.value || 'Ambulance-01',
            lat: lat,
            lng: lng,
            status: statusSelectEl.value,
            speed: speed
          });

          packetCounter++;
          document.getElementById('ping-count').innerText = packetCounter;
        },
        (error) => {
          console.error('GPS Telemetry Error:', error);
          alert(`GPS Permission/Hardware Error: ${error.message}`);
          stopTracking();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      unitInputEl.disabled = false;
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      stopBtn.disabled = true;
      stopBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }
  </script>
</body>
</html>
